targets:
  $default:
    builders:
      slang_build_runner:
        options:
          base_locale: ja
          input_directory: assets/i18n
          input_file_pattern: .i18n.json
          output_directory: lib/core/gen
          output_file_name: slang.g.dart
          locale_handling: true
          flutter_integration: true
          namespaces: false
          translate_var_names: true
          flat_map: false
          imports:
            - package:app/domain/domain.dart
          contexts:
            LayoutMode:
              default_parameter: layoutMode
              generate_enum: false
          stats: true
          format:
            enabled: true
          timestamp: false

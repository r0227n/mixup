include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    # Build / generated artifacts
    - "**/build/**"
    - "**/.dart_tool/**"
    - "**/.symlinks/**"
    - "**/**.g.dart"
    - "**/**.freezed.dart"
  plugins:
    riverpod_lint: ^3.1.3

formatter:
  trailing_commas: preserve

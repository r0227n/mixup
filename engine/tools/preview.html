<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UTAGE Analysis Inspector</title>
  <style>
    :root{color-scheme:dark;--bg:#090c12;--panel:#111722;--panel2:#161e2c;--line:#263247;--text:#edf3ff;--muted:#8c9ab2;--cyan:#42d6d0;--amber:#f3b94f;--pink:#ff6f91;--purple:#9c8cff;--good:#62d49a;--shadow:0 18px 55px #0006;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#183054 0,transparent 34%),radial-gradient(circle at 90% 0,#2b1838 0,transparent 26%),var(--bg);color:var(--text)}button,input,select{font:inherit}.app{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:22px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}.title{font-size:clamp(26px,4vw,46px);letter-spacing:-.04em;margin:5px 0 0}.sub{color:var(--muted);margin:6px 0 0}.loader{display:flex;gap:10px;align-items:center}.file{position:relative;overflow:hidden;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:10px;color:var(--text);cursor:pointer}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}.status{font-size:12px;color:var(--muted);max-width:220px;text-align:right}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}.metric,.panel{background:linear-gradient(145deg,#151c29dd,#0f1520dd);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px}.metric{padding:16px 18px}.metric .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.metric .v{font-size:25px;font-weight:650;margin-top:5px}.metric .u{font-size:12px;color:var(--muted);margin-left:4px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}.main{display:grid;gap:12px;min-width:0}.panel{padding:18px}.panel-head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:14px}.panel h2{font-size:14px;margin:0;letter-spacing:.02em}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}.chart{width:100%;height:auto;display:block;overflow:visible}.axis{stroke:var(--line);stroke-width:1}.gridline{stroke:var(--line);stroke-width:1;opacity:.65}.axistext{fill:var(--muted);font-size:10px}.timeline{display:grid;grid-template-columns:repeat(31,minmax(22px,1fr));gap:4px}.bar{appearance:none;border:1px solid transparent;border-radius:5px;height:32px;padding:0;color:#091017;font-size:9px;font-weight:700;cursor:pointer;transition:.15s transform,.15s outline}.bar:hover,.bar.active{transform:translateY(-2px);outline:2px solid #fff9;outline-offset:1px}.bar.vocal{background:var(--cyan)}.bar.instrumental{background:var(--pink)}.bar.uncertain{background:var(--amber)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line);color:var(--muted);background:#0e1520;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:11px}.chip.on{color:var(--text);border-color:#60728e;background:#1b2637}.detail{position:sticky;top:16px;height:max-content}.detail-empty{color:var(--muted);min-height:230px;display:grid;place-items:center;text-align:center}.bar-no{font-size:44px;letter-spacing:-.05em;margin:2px 0 16px}.tag{font-size:11px;padding:5px 9px;border-radius:99px;color:#091017;font-weight:700;vertical-align:middle;margin-left:8px}.tag.vocal{background:var(--cyan)}.tag.instrumental{background:var(--pink)}.tag.uncertain{background:var(--amber)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.datum{background:#0c121c;border:1px solid var(--line);border-radius:10px;padding:10px}.datum span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.beats{display:flex;gap:6px;margin-top:14px}.beat{flex:1;text-align:center;border-top:3px solid var(--purple);background:#0c121c;padding:9px 2px;border-radius:5px;font-size:10px}.warnings{margin-top:12px;padding:0;list-style:none}.warnings li{color:#e4c985;background:#2b2516;border:1px solid #54461f;border-radius:9px;padding:10px 12px;font-size:11px;margin-top:7px}.table-wrap{overflow:auto;max-height:430px;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:11px}th{position:sticky;top:0;background:#1b2432;color:var(--muted);text-align:right;padding:9px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}td{text-align:right;padding:8px 9px;border-bottom:1px solid #202b3d;white-space:nowrap}tr{cursor:pointer}tbody tr:hover,tbody tr.sel{background:#1a2636}.error{display:none;background:#371824;border:1px solid #7c2945;color:#ffb8c9;padding:14px;border-radius:12px;margin-bottom:12px}.drop{outline:2px dashed var(--cyan);outline-offset:-10px}
    @media(max-width:980px){.metrics{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.detail{position:static}.timeline{grid-template-columns:repeat(16,1fr)}}
    @media(max-width:620px){.app{padding:18px 12px}.top{align-items:flex-start;flex-direction:column}.loader{width:100%;justify-content:space-between}.metrics{grid-template-columns:repeat(2,1fr)}.metric:last-child{grid-column:1/-1}.timeline{grid-template-columns:repeat(8,1fr)}.panel{padding:14px}.status{text-align:left}.legend{gap:8px}}
  </style>
</head>
<body>
<main class="app" id="app">
  <header class="top"><div><div class="eyebrow">Audio analysis / debug preview</div><h1 class="title">UTAGE Analysis Inspector</h1><p class="sub">小節・ビート・ボーカル推定を1つの時間軸で確認</p></div><div class="loader"><label class="file">JSONを選択<input id="file" type="file" accept="application/json,.json"></label><div class="status" id="status">utage-analysis-result.json を読込中…</div></div></header>
  <div class="error" id="error"></div>
  <section class="metrics" id="metrics"></section>
  <div class="layout"><div class="main">
    <section class="panel"><div class="panel-head"><h2>ボーカル確率 / ビート信頼度</h2><div class="legend"><span><i class="dot" style="background:var(--cyan)"></i>contextual vocal</span><span><i class="dot" style="background:var(--purple)"></i>acoustic vocal</span><span><i class="dot" style="background:var(--amber)"></i>beat confidence</span></div></div><svg id="chart" class="chart" viewBox="0 0 1000 290" role="img" aria-label="小節ごとの確率グラフ"></svg></section>
    <section class="panel"><div class="panel-head"><h2>小節タイムライン</h2><div class="toolbar" id="filters"></div></div><div class="timeline" id="timeline"></div></section>
    <section class="panel"><div class="panel-head"><h2>小節データ</h2><span class="status" id="count"></span></div><div class="table-wrap"><table><thead><tr><th>Bar</th><th>Time</th><th>Length</th><th>Beat conf.</th><th>Vocal</th><th>Acoustic</th><th>Δ</th><th>State</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </div><aside class="panel detail" id="detail"><div class="detail-empty">グラフ・タイムライン・表から<br>小節を選択してください</div></aside></div>
</main>
<script>
  const $=s=>document.querySelector(s), state={data:null,selected:null,filters:new Set(['vocal','instrumental','uncertain'])};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pct=n=>(n*100).toFixed(1)+'%'; const time=n=>{const m=Math.floor(n/60);return `${m}:${(n%60).toFixed(2).padStart(5,'0')}`};
  async function boot(){try{const r=await fetch('../utage-analysis-result.json');if(!r.ok)throw Error(`${r.status} ${r.statusText}`);load(await r.json(),'utage-analysis-result.json')}catch(e){fail('自動読込できませんでした。上の「JSONを選択」から utage-analysis-result.json を開いてください。')}}
  function validate(d){if(!d||!Array.isArray(d.bars))throw Error('bars 配列がありません');for(const b of d.bars){for(const k of ['number','start_seconds','end_seconds','beat_confidence','vocal_probability','vocal_state'])if(!(k in b))throw Error(`bar ${b.number??'?'}: ${k} がありません`)}return d}
  function fail(msg){$('#error').textContent=msg;$('#error').style.display='block';$('#status').textContent='ファイルを選択してください'}
  function load(raw,name){try{const d=validate(raw);state.data=d;state.selected=d.bars[0]||null;$('#error').style.display='none';$('#status').textContent=`${name} · ${d.bars.length} bars`;render()}catch(e){fail(e.message)}}
  function render(){const d=state.data,b=d.bars,end=b.at(-1)?.end_seconds||0,counts=Object.fromEntries(['vocal','instrumental','uncertain'].map(s=>[s,b.filter(x=>x.vocal_state===s).length]));$('#metrics').innerHTML=[['Tempo',d.tempo_bpm?.toFixed(3),'BPM'],['Duration',time(end),''],['Bars',b.length,''],['Global confidence',pct(d.beat_confidence),''],['Analyzer',`v${esc(d.analyzer_version)}`,'']].map(x=>`<div class="metric"><div class="k">${x[0]}</div><div class="v">${x[1]}<span class="u">${x[2]}</span></div></div>`).join('');
    $('#filters').innerHTML=['vocal','instrumental','uncertain'].map(s=>`<button class="chip ${state.filters.has(s)?'on':''}" data-filter="${s}">${s} · ${counts[s]}</button>`).join('');$('#filters').querySelectorAll('button').forEach(x=>x.onclick=()=>{state.filters.has(x.dataset.filter)?state.filters.delete(x.dataset.filter):state.filters.add(x.dataset.filter);renderList()});renderChart();renderList();select(state.selected)}
  function renderChart(){const bars=state.data.bars,svg=$('#chart'),W=1000,H=290,p={l:43,r:16,t:12,b:30},iw=W-p.l-p.r,ih=H-p.t-p.b,x=i=>p.l+i/(Math.max(1,bars.length-1))*iw,y=v=>p.t+(1-v)*ih,path=key=>bars.map((b,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(b[key]??b.vocal_probability).toFixed(1)}`).join(' ');let h='';for(let v=0;v<=1.001;v+=.25)h+=`<line class="gridline" x1="${p.l}" y1="${y(v)}" x2="${W-p.r}" y2="${y(v)}"/><text class="axistext" x="${p.l-7}" y="${y(v)+3}" text-anchor="end">${Math.round(v*100)}</text>`;for(let i=0;i<bars.length;i+=20)h+=`<text class="axistext" x="${x(i)}" y="${H-8}" text-anchor="middle">${bars[i].number}</text>`;h+=`<path d="${path('acoustic_vocal_probability')}" fill="none" stroke="var(--purple)" stroke-width="2" opacity=".75"/><path d="${path('vocal_probability')}" fill="none" stroke="var(--cyan)" stroke-width="2.5"/><path d="${path('beat_confidence')}" fill="none" stroke="var(--amber)" stroke-width="1.6" opacity=".9"/>`;h+=bars.map((b,i)=>`<circle data-i="${i}" cx="${x(i)}" cy="${y(b.vocal_probability)}" r="6" fill="transparent" style="cursor:pointer"><title>Bar ${b.number}: ${pct(b.vocal_probability)}</title></circle>`).join('');svg.innerHTML=h;svg.querySelectorAll('circle').forEach(c=>c.onclick=()=>select(bars[+c.dataset.i]))}
  function renderList(){const all=state.data.bars,bars=all.filter(b=>state.filters.has(b.vocal_state));$('#count').textContent=`${bars.length} / ${all.length} bars`;$('#timeline').innerHTML=bars.map(b=>`<button class="bar ${esc(b.vocal_state)} ${state.selected?.number===b.number?'active':''}" data-n="${b.number}" title="Bar ${b.number} · ${time(b.start_seconds)} · vocal ${pct(b.vocal_probability)}">${b.number}</button>`).join('');$('#rows').innerHTML=bars.map(b=>`<tr data-n="${b.number}" class="${state.selected?.number===b.number?'sel':''}"><td>${b.number}</td><td>${time(b.start_seconds)}–${time(b.end_seconds)}</td><td>${(b.end_seconds-b.start_seconds).toFixed(2)}s</td><td>${pct(b.beat_confidence)}</td><td>${pct(b.vocal_probability)}</td><td>${pct(b.acoustic_vocal_probability)}</td><td>${((b.vocal_probability-b.acoustic_vocal_probability)*100).toFixed(1)}pt</td><td>${esc(b.vocal_state)}</td></tr>`).join('');document.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>select(all.find(b=>b.number===+el.dataset.n)))}
  function select(b){if(!b)return;state.selected=b;const delta=b.vocal_probability-b.acoustic_vocal_probability;$('#detail').innerHTML=`<div class="eyebrow">Selected bar</div><div class="bar-no">#${b.number}<span class="tag ${esc(b.vocal_state)}">${esc(b.vocal_state)}</span></div><div class="detail-grid"><div class="datum"><span>START</span>${time(b.start_seconds)}</div><div class="datum"><span>END</span>${time(b.end_seconds)}</div><div class="datum"><span>BEAT CONF.</span>${pct(b.beat_confidence)}</div><div class="datum"><span>DURATION</span>${(b.end_seconds-b.start_seconds).toFixed(3)} s</div><div class="datum"><span>VOCAL</span>${pct(b.vocal_probability)}</div><div class="datum"><span>ACOUSTIC</span>${pct(b.acoustic_vocal_probability)}</div></div><div class="beats">${(b.beats_seconds||[]).map((v,i)=>`<div class="beat"><span style="color:var(--muted)">${i+1}</span><br>${v.toFixed(2)}s</div>`).join('')}</div><div class="datum" style="margin-top:12px"><span>CONTEXT DELTA</span>${delta>=0?'+':''}${(delta*100).toFixed(2)} point</div>${state.data.warnings?.length?`<ul class="warnings">${state.data.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}`;renderList()}
  $('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{load(JSON.parse(await f.text()),f.name)}catch(err){fail(`JSONを読めません: ${err.message}`)}};
  const app=$('#app');for(const ev of ['dragenter','dragover'])app.addEventListener(ev,e=>{e.preventDefault();app.classList.add('drop')});for(const ev of ['dragleave','drop'])app.addEventListener(ev,e=>{e.preventDefault();app.classList.remove('drop')});app.addEventListener('drop',async e=>{const f=e.dataTransfer.files[0];if(f)try{load(JSON.parse(await f.text()),f.name)}catch(err){fail(err.message)}});boot();
</script>
</body>
</html>

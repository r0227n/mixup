[package]
name = "mixup-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "allow", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[lints.rust]
unsafe_code = "allow"

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.12.0"
mixup-analysis = { path = "../analysis" }
mixup-domain = { path = "../domain" }

[dev-dependencies]
tempfile = "3"
